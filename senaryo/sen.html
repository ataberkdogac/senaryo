<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body
    style="max-width: 1000px; margin: 10px auto; padding: 20px"
    onload="reform()"
  >
    <form
      class="was-validated"
      id="form"
      action="http://127.0.0.1:5500/senaryo/datalist.html"
      method="post"
    >
      <div class="row">
        <div class="col">
          <label for="firstname" class="form-label">First Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="First Name"
            name="firstname"
            required
          />
        </div>
        <div class="col">
          <label for="lastname" class="form-label">Last Name</label>
          <input
            type="text"
            class="form-control"
            id="lastname"
            placeholder="Last Name"
            name="lastname"
            required
          />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="birthday" class="form-label">Birth Date:</label>
        </div>
        <div class="col">
          <input type="date" id="birthday" name="birthday" />
        </div>
      </div>

      Sex:
      <div class="form-check">
        <input
          type="radio"
          class="form-check-input"
          id="sexmale"
          name="sex"
          value="Male"
          required
        />Male
      </div>
      <div class="form-check">
        <input
          type="radio"
          class="form-check-input"
          id="sexfem"
          name="sex"
          value="Female"
        />Female
      </div>

      <label for="city" class="form-label">City:</label>
      <select class="form-select" id="city" name="city" required>
        <option value="">Please select a city</option>
        <option>İstanbul</option>
        <option>Ankara</option>
        <option>Antalya</option>
        <option>İzmir</option>
        <option>Eskişehir</option>
      </select>

      <div class="row">
        <div class="col">
          Prefered Language(s):
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="eng"
              name="lang"
              value="Engish"
            />Engish
          </div>
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="tr"
              name="lang"
              value="Turkish"
            />Turkish
          </div>
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="de"
              name="lang"
              value="Deutsch"
            />Deutsch
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="othlangcheck" />
            <input type="text" placeholder="Other" id="othlang" name="lang" />
          </div>
        </div>
        <div class="col">
          Interest(s):
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="cod"
              name="int"
              value="Coding"
            />Coding
          </div>
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="daan"
              name="int"
              value="Data Analitics"
            />Data Analitics
          </div>
          <div class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="grde"
              name="int"
              value="Graphic Design"
            />Graphic Design
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="othintcheck" />
            <input type="text" placeholder="Other" id="othint" name="int" />
          </div>
        </div>
      </div>
      <label for="exp" class="form-label"
        >How Would You Rate Your Experience</label
      >

      <input
        type="range"
        class="form-range"
        id="exp"
        name="exp"
        min="1"
        max="10"
      />

      <label for="com" class="form-label">Things You Want To Add:</label>
      <textarea
        class="form-control"
        rows="5"
        id="com"
        name="com"
        placeholder="Optional"
      ></textarea>

      <div class="form-check">
        <label for="terms">
          Agree to
          <button
            type="button"
            class="btn btn-link p-0 pb-1"
            data-bs-toggle="modal"
            data-bs-target="#myModal"
          >
            Terms and Conditions
          </button>
        </label>
        <input
          class="form-check-input"
          type="checkbox"
          id="terms"
          name="terms"
          required
        />

        <div class="valid-feedback">You can continue.</div>
        <div class="invalid-feedback">Check this checkbox to continue.</div>
      </div>

      <div class="modal" id="myModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              Terms and Conditions
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">aaaaaaaaaaaaaaaaaa</div>
          </div>
        </div>
      </div>

      <input
        class="form-control"
        type="file"
        id="img"
        name="choosefile"
        accept=".jpg , .jpeg"
      />
      <div>
        <img id="preview" />
      </div>

      <button type="submit" class="btn bg-primary" id="submit">Submit</button>
    </form>

    <script>
      document
        .getElementById("form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          getform();
        });

      const person = {
        photo: "",
        firstname: "",
        lastname: "",
        birthday: "",
        sex: "",
        city: "",
        langs: {},
        ints: {},
        int: "",
        exp: "",
        com: "",
        id: "",
      };

      var base64 = "";
      var img = document.getElementById("img");
      img.addEventListener("change", getFile);

      function getform() {
        var form = document.getElementById("form");
        var data = new FormData(form);
        var atab = Object.create(person);
        var stoId = localStorage.getItem("uniqueid");
        var uniqueId = "";

        var arp = JSON.parse(localStorage.getItem("arrpos"));
        if (stoId === null || stoId === "null") {
          uniqueId = new Date(Math.ceil(Math.random() * 1e13))
            .valueOf()
            .toString(36);
        } else {
          uniqueId = stoId;
          localStorage.setItem("uniqueid", null);
        }

        atab.photo = base64;
        atab.firstname = data.get("firstname");
        atab.lastname = data.get("lastname");
        atab.birthday = data.get("birthday");
        atab.sex = data.get("sex");
        atab.city = data.get("city");
        getLangs(atab);
        getInts(atab);
        atab.exp = data.get("exp");
        atab.com = data.get("com");
        atab.id = uniqueId;
        console.log(atab);

        var nA = [atab];
        var oS = localStorage.getItem("storedArray");
        var oA = [];
        oA = JSON.parse(oS);

        if (arp === -1 || arp === null) {
          var arr = nA.concat(oA);
          arr = arr.filter((Element) => Element !== null);

          localStorage.setItem("storedArray", JSON.stringify(arr));
        } else {
          oA[arp] = nA[0];

          localStorage.setItem("arrpos", -1);
          oA = oA.filter((Element) => Element !== null);

          localStorage.setItem("storedArray", JSON.stringify(oA));
        }
        location.href = "http://127.0.0.1:5500/senaryo/datalist.html";
      }

      function getFile() {
        var pre = document.getElementById("preview");

        var nimg = document.getElementById("img").files[0];
        if (nimg == null) {
          return;
        }
        var reader = new FileReader();
        reader.readAsDataURL(nimg);
        reader.onloadend = function () {
          base64 = reader.result;
          pre.src = base64;
          pre.style = "height:100px; width:100px; object-fit: cover;";
        };
      }

      function getLangs(atab) {
        var langs = {};
        langs.eng = document.getElementById("eng").checked;
        langs.tr = document.getElementById("tr").checked;
        langs.de = document.getElementById("de").checked;
        langs.lanc = document.getElementById("othlangcheck").checked;
        langs.lan = document.getElementById("othlang").value;

        atab.langs = langs;
      }

      function getInts(atab) {
        var ints = {};
        ints.cod = document.getElementById("cod").checked;
        ints.daan = document.getElementById("daan").checked;
        ints.grde = document.getElementById("grde").checked;
        ints.intc = document.getElementById("othintcheck").checked;
        ints.int = document.getElementById("othint").value;
        atab.ints = ints;
      }

      function reform() {
        var unid = localStorage.getItem("uniqueid");
        var arp = JSON.parse(localStorage.getItem("arrpos"));

        if (arp > -1 && arp != null) {
        } else {
          return;
        }

        var arp = localStorage.getItem("arrpos");
        var oS = localStorage.getItem("storedArray");
        var oA = JSON.parse(oS);
        var person = oA[arp];

        document.getElementById("name").value = person.firstname;
        document.getElementById("lastname").value = person.lastname;

        document.getElementById("birthday").value = person.birthday;
        document.getElementById("city").value = person.city;
        if (person.sex === "Male") {
          document.getElementById("sexmale").checked = true;
        } else {
          document.getElementById("sexfem").checked = true;
        }
        var lanar = person.langs;
        var intar = person.ints;
        document.getElementById("eng").checked = lanar.eng;
        document.getElementById("tr").checked = lanar.tr;
        document.getElementById("de").checked = lanar.de;
        document.getElementById("othlangcheck").checked = lanar.lanc;
        document.getElementById("othlang").value = lanar.lan;
        document.getElementById("cod").checked = intar.cod;
        document.getElementById("daan").checked = intar.daan;
        document.getElementById("grde").checked = intar.grde;
        document.getElementById("othintcheck").checked = intar.intc;
        document.getElementById("othint").value = intar.int;
        document.getElementById("exp").value = person.exp;
        document.getElementById("com").value = person.com;
        if (person.photo === "") {
        } else {
          document.getElementById("preview").src = person.photo;
          document.getElementById("preview").style =
            "height:100px; width:100px; object-fit: cover;";
          base64 = person.photo;
        }
      }
    </script>
  </body>
</html>
