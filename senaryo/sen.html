<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body style="max-width: 1000px; margin: auto; padding: 20px;">
    <form action="/action_page.php">
      <div class="mb-3">
        Name:
        <input type="name" class="form-control" id="name" placeholder="First Name" />
      </div>
      <div class="mb-3">
        Last Name:
        <input type="surname" class="form-control" id="surname" placeholder="Last Name" />
      </div>
      Birth Date:
      <div class="row">
        <div class="col">
          <select class="form-select" id="days">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
          </select>
        </div>
        <div class="col">
          <select class="form-select" id="months">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
          </select>
        </div>
        <div class="col">
          <select class="form-select" id="years">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
          </select>
        </div>
      </div>
      Sex:
      <div class="form-check">
        <input type="radio" class="form-check-input" id="sexmale" value="male" name="sex">Male
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="sexfem" value="female" name="sex">Female
      </div>
      <div class="form-check">
        <input type="radio" class="form-check-input" id="sexoth" value="other"  name="sex">Other
      </div>

      City:
      <select class="form-select" id="city">
        <option>İstanbul</option>
        <option>Ankara</option>
        <option>Antalya</option>
        <option>İzmir</option>
        <option>Eskişehir</option>
      </select>

      <div class="row">
        <div class="col">
            Prefered Languages:
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="eng" name="lang">Engish
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="tr" name="lang">Turkish
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="de" name="lang">Deutsch
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="othlang" name="lang">
                <input type="text" placeholder="Other">
            </div>
        </div>
        <div class="col">
            Interests:
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="cod" name="int">Coding
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="daan" name="int">Data Analitics
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="grde" name="int">Graphic Design
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="othint" name="int">
                <input type="text" placeholder="Other">
            </div>
        </div>
      </div>
      How Would You Rate Your Experience
      <input type="range" class="form-range" id="exp" min="1" max="10">
      
      Things You Want To Add:
      <textarea class="form-control" rows="5" id="com"></textarea>

      <button type="submit" class="btn btn-primary">Submit</button>
      </form>
  </body>
</html>
