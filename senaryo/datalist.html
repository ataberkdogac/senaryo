<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
  </head>
  <body onload="getids()">
    <div class="table-responsive">
      <table class="table" id="myTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Lastname</th>
            <th>BirthDate</th>
            <th>Sex</th>
            <th>City</th>
            <th>Language(s)</th>
            <th>Interest(s)</th>
            <th>Experience</th>
            <th>Comments</th>
          </tr>
        </thead>
      </table>
    </div>
    <script>
      function getids() {
        var arr = localStorage.getItem("storedArray");
        var a = JSON.parse(arr);
        a = a.filter(Element => Element !== null);
        
        
        for (var k = 0; k < a.length; k++) {
          addRow(a[k]);
        }
      }

      function addRow(person) {
        var table = document.getElementById("myTable");

        var newrow = table.insertRow(-1);
        newrow.setAttribute("id", person.id);
        var keys = Object.keys(person);
        var vals = Object.values(person);
        for (var i = 0; i < keys.length; i++) {
          if (keys[i] === "langs") {
            var newcell = newrow.insertCell(-1);
            var txt = new Array();
            if (person.langs.eng === true) {
              txt.push("English");
            }
            if (person.langs.tr === true) {
              txt.push("Turkish");
            }
            if (person.langs.de === true) {
              txt.push("Deutch");
            }
            if (person.langs.lanc === true) {
              txt.push(person.langs.lan);
            }
            newcell.append(txt.toString());
          } else if (keys[i] === "ints") {
            var newcell = newrow.insertCell(-1);
            var txt = new Array();
            if (person.ints.cod === true) {
              txt.push("Coding");
            }
            if (person.ints.daan === true) {
              txt.push("Data Analitics");
            }
            if (person.ints.grde === true) {
              txt.push("Graphic Design");
            }
            if (person.ints.intc === true) {
              txt.push(person.ints.int);
            }
            newcell.append(txt.toString());
          } else if (keys[i] === "id") {
            var editb = document.createElement("button");
            editb.append("Edit");
            editb.setAttribute("id", vals[i]);

            var closeb = document.createElement("button");
            closeb.append("X");
            closeb.setAttribute("id", vals[i]);

            var newcell = newrow.insertCell(-1);
            newcell.append(editb);
            newcell.append(closeb);
            closeb.onclick = function () {
              var cid = closeb.getAttribute("id");
              cl(cid);
            };

            editb.onclick = function () {
              var eid = editb.getAttribute("id");
              ed(eid);
            };

          } else if (keys[i] === "birthday") {
            var newcell = newrow.insertCell(-1);
            newcell.append(person.birthday);
          } else {
            var newcell = newrow.insertCell(-1);
            var txt = vals[i];
            newcell.append(txt);
          }
        }
      }

      function cl(unid) {
        var ind;
        var arr = localStorage.getItem("storedArray");
        var a = JSON.parse(arr);
        for (var j = 0; j < a.length; j++) {
          if (a[j].id === unid) {
            ind = j;
          }
        }
        a.splice(ind, 1);
        localStorage.setItem("uniqueid", null);
        localStorage.setItem("arrpos", -1);
        localStorage.setItem("storedArray", JSON.stringify(a));
        var row = document.getElementById(unid);
        row.remove();
      }

      function ed(unid) {
        var ind;
        var arr = localStorage.getItem("storedArray");
        var a = JSON.parse(arr);
        for (var j = 0; j < a.length; j++) {
          if (a[j].id === unid) {
            ind = j;
          }
        }
        localStorage.setItem("uniqueid", unid);
        localStorage.setItem("arrpos", ind);
        location.href = 'http://127.0.0.1:5500/senaryo/sen.html';
      }

      
    </script>
  </body>
</html>
